name: ci
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      authorize_release:
        description: Explicitly authorize publishing the version tag selected below
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  linux-gnu:
    name: Linux (GNU coreutils, gawk, GNU sed)
    runs-on: ubuntu-24.04
    env: { MDB_REQUIRE_GNU: '1', CI: '1' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y gawk jq ripgrep
      - run: sed --version | head -1 && gawk --version | head -1 && sort --version | head -1
      - run: npm ci
      - run: npm run verify            # lint, typecheck, fast tests
      - run: node --test tests/linux-packaging.test.mjs
      - name: Verify Linux client and server daemons on the disposable runner
        run: sudo env ENGRAM_TEST_SYSTEMD=1 "$(command -v node)" --test tests/linux-systemd-smoke.mjs
      - run: npm run verify:unix       # includes GNU-only parity cases and sandboxed awk/sed execution (MDB_REQUIRE_GNU=1 fails if the tools are missing)
      - run: npm run verify:query
      - run: npm run verify:search
      - run: npm run verify:memory
      - run: npm run verify:security
      - run: npm run verify:recovery
      - run: npm run verify:platform
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-verification
          path: |
            verification/*/report.*
            verification/*/last-output.txt
          retention-days: 7
  linux-reliability:
    name: Linux ACID and isolation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run verify:acid
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-acid
          path: |
            verification/acid/report.*
            verification/acid/last-output.txt
          retention-days: 7
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run verify && npm run verify:unix && npm run verify:query
      - run: node --test tests/macos-packaging.test.mjs

  exported-source:
    name: Exported source full verification (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - name: Build a source-only archive and verify the extracted tree
        run: |
          set -euo pipefail
          export_root="$(mktemp -d)"
          trap 'rm -rf "$export_root"' EXIT
          git archive --format=tar HEAD | tar -xf - -C "$export_root"
          cd "$export_root"
          npm ci
          npm run verify:all

  package-apps:
    name: Package client and server (${{ matrix.target }})
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.authorize_release == true && startsWith(github.ref, 'refs/tags/v'))
    needs: [linux-gnu, linux-reliability, macos, exported-source]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            os: linux
            arch: x64
          - target: darwin-arm64
            runner: macos-14
            os: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/standalone.mjs package "${{ matrix.os }}" "${{ matrix.arch }}"
      - name: Build native macOS apps with app and menu bar icons
        if: matrix.os == 'darwin'
        run: node scripts/package-macos.mjs dist-macos "dist-standalone/engram-${{ matrix.os }}-${{ matrix.arch }}"
      - name: Package Linux client and server daemons
        if: matrix.os == 'linux'
        run: node scripts/package-linux.mjs dist-linux "dist-standalone/engram-${{ matrix.os }}-${{ matrix.arch }}"
      - name: Build direct Linux installer assets
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          for role in client server; do
            node scripts/package-linux-deb.mjs "dist-linux/engram-${role}" release "${role}"
            mv "release/engram-${role}_"*"_amd64.deb" "release/engram-${role}-${{ matrix.target }}-${GITHUB_SHA::12}.deb"
          done
      - name: Build direct macOS disk image installer assets
        if: matrix.os == 'darwin'
        run: |
          set -euo pipefail
          mkdir -p release
          for role in client server; do
            if [ "$role" = client ]; then display="Client"; else display="Server"; fi
            name="Engram ${display}"
            package="release/engram-${role}-${{ matrix.target }}-${GITHUB_SHA::12}"
            mkdir -p "$package"
            ditto "dist-macos/${name}.app" "$package/${name}.app"
            cp dist-macos/install-macos-boot.mjs dist-macos/README.md "$package/"
            hdiutil create -quiet -ov -format UDZO -volname "$name" -srcfolder "$package" "${package}.dmg"
            rm -rf "$package"
          done
      - name: Upload installable app assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/engram-*
          if-no-files-found: error
          retention-days: 1

  release-qualification:
    name: Qualify explicit version tag
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.authorize_release == true))
    needs: [linux-gnu, linux-reliability, macos, exported-source]
    runs-on: ubuntu-24.04
    env:
      MDB_RELEASE_PROFILE: full-intelligence-beta
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Require a semantic version tag on a commit reachable from main
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - run: npm run verify:all
      - run: npm run verify:release
      - name: Require the explicitly selected profile to be eligible
        run: |
          node -e "const r=require('./verification/release-report.json'); if(r.releaseProfile!=='full-intelligence-beta' || !['BETA','GA_ELIGIBLE'].includes(r.releaseLevel)) { console.error(r.releaseProfile, r.releaseLevel, r.releasePolicy?.blockers); process.exit(1); }"
      - uses: actions/upload-artifact@v4
        with:
          name: release-qualification-evidence
          path: verification/release-report.json
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish client and server installers as direct release assets
    if: github.event_name == 'workflow_dispatch' && inputs.authorize_release == true && startsWith(github.ref, 'refs/tags/v')
    needs: [package-apps, release-qualification]
    runs-on: ubuntu-24.04
    environment: engram-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - uses: actions/download-artifact@v4
        with:
          name: release-qualification-evidence
          path: verification
      - name: Verify signed owner authorization for this exact source and tag
        env:
          MDB_RELEASE_PROFILE: full-intelligence-beta
          ENGRAM_RELEASE_AUTHORIZATION_JSON: ${{ secrets.ENGRAM_RELEASE_AUTHORIZATION_JSON }}
          ENGRAM_RELEASE_AUTHORIZATION_PUBLIC_KEY: ${{ secrets.ENGRAM_RELEASE_AUTHORIZATION_PUBLIC_KEY }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: node dist/scripts/verify-release-authorization.js
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release/assets
          merge-multiple: true
      - name: Write checksums for the individual app assets
        run: sha256sum release/assets/engram-* > release/assets/SHA256SUMS
      - name: Publish the explicitly selected version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release/assets/engram-* release/assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Engram ${GITHUB_REF_NAME}" \
            --notes "Automated installable Engram client and server apps for commit ${GITHUB_SHA}. Linux x64 assets are Debian installers (.deb); macOS arm64 assets are disk image installers (.dmg) containing the app and startup installer. Linux services can be enabled for startup with the included engram-client-service and engram-server-service installers. No service is enabled automatically by installing the package." \
            --prerelease
