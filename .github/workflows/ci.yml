name: ci
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  linux-gnu:
    name: Linux (GNU coreutils, gawk, GNU sed)
    runs-on: ubuntu-24.04
    env: { MDB_REQUIRE_GNU: '1', CI: '1' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y gawk jq ripgrep
      - run: sed --version | head -1 && gawk --version | head -1 && sort --version | head -1
      - run: npm ci
      - run: npm run verify            # lint, typecheck, fast tests
      - run: node --test tests/linux-packaging.test.mjs
      - name: Verify Linux client and server daemons on the disposable runner
        run: sudo env ENGRAM_TEST_SYSTEMD=1 "$(command -v node)" --test tests/linux-systemd-smoke.mjs
      - run: npm run verify:unix       # includes GNU-only parity cases and sandboxed awk/sed execution (MDB_REQUIRE_GNU=1 fails if the tools are missing)
      - run: npm run verify:query
      - run: npm run verify:search
      - run: npm run verify:memory
      - run: npm run verify:security
      - run: npm run verify:recovery
      - run: npm run verify:platform
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-verification
          path: |
            verification/*/report.*
            verification/*/last-output.txt
          retention-days: 7
  linux-reliability:
    name: Linux ACID and isolation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run verify:acid
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-acid
          path: |
            verification/acid/report.*
            verification/acid/last-output.txt
          retention-days: 7
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run verify && npm run verify:unix && npm run verify:query
      - run: node --test tests/macos-packaging.test.mjs

  package-client:
    name: Package client
    if: github.event_name == 'push'
    needs: [linux-gnu, linux-reliability, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: node scripts/package-client.mjs release/client
      - uses: actions/upload-artifact@v4
        with:
          name: release-client-portable
          path: release/client/*.tgz
          if-no-files-found: error
          retention-days: 1

  package-server:
    name: Package server (${{ matrix.target }})
    if: github.event_name == 'push'
    needs: [linux-gnu, linux-reliability, macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            os: linux
            arch: x64
          - target: darwin-arm64
            runner: macos-14
            os: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/standalone.mjs package "${{ matrix.os }}" "${{ matrix.arch }}"
      - name: Build native macOS apps with app and menu bar icons
        if: matrix.os == 'darwin'
        run: node scripts/package-macos.mjs dist-macos "dist-standalone/engram-${{ matrix.os }}-${{ matrix.arch }}"
      - name: Package Linux client and server daemons
        if: matrix.os == 'linux'
        run: node scripts/package-linux.mjs dist-linux "dist-standalone/engram-${{ matrix.os }}-${{ matrix.arch }}"
      - name: Archive client and server packages
        run: |
          mkdir -p release/server release/client
          if [ "${{ matrix.os }}" = "darwin" ]; then
            tar -czf "release/server/engram-server-${{ matrix.target }}.tar.gz" -C dist-macos "Engram Server.app" install-macos-boot.mjs README.md
            tar -czf "release/client/engram-client-${{ matrix.target }}.tar.gz" -C dist-macos "Engram Client.app" install-macos-boot.mjs README.md
          else
            tar -czf "release/server/engram-server-${{ matrix.target }}.tar.gz" -C dist-linux/engram-server .
            tar -czf "release/client/engram-client-${{ matrix.target }}.tar.gz" -C dist-linux/engram-client .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-client-${{ matrix.target }}
          path: release/client/*.tar.gz
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: release-server-${{ matrix.target }}
          path: release/server/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish combined client and server release
    if: github.event_name == 'push'
    needs: [package-client, package-server]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-client-*
          path: release/client
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: release-server-*
          path: release/servers
          merge-multiple: true
      - name: Assemble the two release packages
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p release/payload/server release/payload/client
          cp release/client/*.tgz release/client/*.tar.gz release/payload/client/
          tar -czf "release/payload/engram-client-${GITHUB_SHA::12}.tar.gz" -C release/payload/client .
          cp release/servers/*.tar.gz release/payload/server/
          tar -czf "release/payload/engram-server-${GITHUB_SHA::12}.tar.gz" -C release/payload/server .
      - name: Create one prerelease for this push
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          tag="ci-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            "release/payload/engram-client-${GITHUB_SHA::12}.tar.gz" \
            "release/payload/engram-server-${GITHUB_SHA::12}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Engram build ${GITHUB_SHA::12}" \
            --notes "Automated client and server packages for commit ${GITHUB_SHA}. Both include Linux x64 daemon bundles and macOS arm64 apps with background startup support. Client also includes portable CLI/SDK." \
            --prerelease
