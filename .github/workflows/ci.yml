name: ci
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  linux-gnu:
    name: Linux (GNU coreutils, gawk, GNU sed)
    runs-on: ubuntu-24.04
    env: { MDB_REQUIRE_GNU: '1', CI: '1' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y gawk jq ripgrep
      - run: sed --version | head -1 && gawk --version | head -1 && sort --version | head -1
      - run: npm ci
      - run: npm run verify            # lint, typecheck, fast tests
      - run: npm run verify:unix       # includes GNU-only parity cases and sandboxed awk/sed execution (MDB_REQUIRE_GNU=1 fails if the tools are missing)
      - run: npm run verify:query
      - run: npm run verify:search
      - run: npm run verify:memory
      - run: npm run verify:security
      - run: npm run verify:recovery
      - run: npm run verify:platform
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-verification
          path: |
            verification/*/report.*
            verification/*/last-output.txt
          retention-days: 7
  linux-reliability:
    name: Linux ACID and isolation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run verify:acid
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-acid
          path: |
            verification/acid/report.*
            verification/acid/last-output.txt
          retention-days: 7
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run verify && npm run verify:unix && npm run verify:query

  package-client:
    name: Package client
    if: github.event_name == 'push'
    needs: [linux-gnu, linux-reliability, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: node scripts/package-client.mjs release/client
      - uses: actions/upload-artifact@v4
        with:
          name: release-client
          path: release/client/*.tgz
          if-no-files-found: error
          retention-days: 1

  package-server:
    name: Package server (${{ matrix.target }})
    if: github.event_name == 'push'
    needs: [linux-gnu, linux-reliability, macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            os: linux
            arch: x64
          - target: darwin-arm64
            runner: macos-14
            os: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/standalone.mjs package "${{ matrix.os }}" "${{ matrix.arch }}"
      - run: mkdir -p release/server && tar -czf "release/server/engram-server-${{ matrix.target }}.tar.gz" -C "dist-standalone/engram-${{ matrix.os }}-${{ matrix.arch }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: release-server-${{ matrix.target }}
          path: release/server/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish combined client and server release
    if: github.event_name == 'push'
    needs: [package-client, package-server]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-client
          path: release/client
      - uses: actions/download-artifact@v4
        with:
          pattern: release-server-*
          path: release/servers
          merge-multiple: true
      - name: Assemble the two release packages
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p release/payload/server
          client_archive="$(find release/client -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$client_archive"
          cp "$client_archive" "release/payload/engram-client-${GITHUB_SHA::12}.tgz"
          cp release/servers/*.tar.gz release/payload/server/
          tar -czf "release/payload/engram-server-${GITHUB_SHA::12}.tar.gz" -C release/payload/server .
      - name: Create one prerelease for this push
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          tag="ci-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            "release/payload/engram-client-${GITHUB_SHA::12}.tgz" \
            "release/payload/engram-server-${GITHUB_SHA::12}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Engram build ${GITHUB_SHA::12}" \
            --notes "Automated client and server packages for commit ${GITHUB_SHA}. Server package contains Linux x64 and macOS arm64 bundles." \
            --prerelease
